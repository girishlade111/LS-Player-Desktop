[package]
name = "ls-player"
version = "2.4.0"
description = "LS Player Enterprise Video Application"
authors = ["LS Player Engineering"]
edition = "2021"

[lib]
name = "ls_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
